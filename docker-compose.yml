# Local development — services will be wired up in Phase 0
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: growth
      POSTGRES_PASSWORD: growth
      POSTGRES_DB: growth_predictor
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

